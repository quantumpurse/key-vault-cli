# Vendored from trezor/trezor-firmware branch `ckb-sphincsplus-dev`
# (rust/trezor-client). Local edits vs upstream:
#   * dropped the inner [workspace]/[workspace.dependencies] and the `build`
#     codegen member so this builds as a plain path dependency (the CKB
#     protobuf bindings are pre-generated and checked in under src/protos);
#   * inlined `protobuf = "=3.7.2"` (was workspace-inherited);
#   * enabled `rusb` `vendored` so libusb is built from source (no system
#     libusb dependency on the host).
# Consumed by crates/trezor-signer with default-features = false, features = ["ckb"].
[package]
name = "trezor-client"
version = "0.1.5"
authors = [
    "Piyush Kumar <piyushkumar2k02@kgpian.iitkgp.ac.in>",
    "joshieDo <ranriver@protonmail.com>",
    "DaniPopes <57450786+DaniPopes@users.noreply.github.com>",
    "Roman Zeyde <me@romanzey.de>",
    "Steven Roose <steven@stevenroose.org>",
]
license = "CC0-1.0"
homepage = "https://github.com/trezor/trezor-firmware/tree/master/rust/trezor-client"
repository = "https://github.com/trezor/trezor-firmware"
description = "Client library for interfacing with Trezor hardware wallet devices"
keywords = ["ethereum", "bitcoin", "trezor", "wallet"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
readme = "README.md"
edition = "2021"
rust-version = "1.60"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
protobuf = "=3.7.2"
byteorder = "1.4"
rusb = { version = "0.9", features = ["vendored"] }

hex = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2.0"
tracing = "0.1"

# bitcoin
bitcoin = { version = "0.32", optional = true }
unicode-normalization = { version = "0.1.22", optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
serial_test = "3"

[features]
default = ["bitcoin", "ethereum", "solana"]

# Client implementations
bitcoin = ["dep:bitcoin", "unicode-normalization"]
ethereum = []

# Just bindings to the Trezor protobufs
cardano = []
eos = []
evolu = []
monero = []
nem = []
nostr = []
ripple = []
solana = []
stellar = []
tezos = []
tron = []
ckb = []
webauthn = []
