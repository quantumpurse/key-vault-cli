[package]
name = "trezor-connect"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Trezor Safe hardware connector for QuantumPurse: streams a CKB transaction to the device and returns a SPHINCS+ witness lock."

[dependencies]
# Vendored Trezor host client (Protocol v1 + UDP/USB transports + generated CKB
# protobuf bindings). Only the `ckb` message bindings are pulled in.
trezor-client = { path = "../../vendor/trezor-client", default-features = false, features = ["ckb"] }

qpv2-core = { path = "../qpv2-core" }
ckb-fips205-utils = { path = "../ckb-fips205-utils", features = ["signing"] }
ckb-types = "=1.0.1"

# Trezor Host Protocol (THP v2) — the encrypted session the Safe 7 firmware
# requires. Provides the channel/handshake/framing; the Noise crypto backend and
# getrandom supply the primitives.
trezor-thp = { path = "../../vendor/trezor-thp", features = ["use_std"] }
trezor-noise-rust-crypto = { git = "https://github.com/trezor/noise-rust", rev = "1bb08dfdfc11160b760b8d28c09677ed72fb1fff", default-features = false, features = ["use-x25519", "use-aes-256-gcm", "use-sha2"] }
getrandom = "0.3"
log = "0.4"

# USB transport to a physical device. `vendored` builds libusb from source so
# no system package is needed (same choice as the vendored trezor-client).
rusb = { version = "0.9", features = ["vendored"] }

# CodeEntry pairing (CPace255) and on-disk credential persistence.
sha2 = "0.10"
num-bigint = "0.4"
x25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same pinned protobuf runtime the vendored client uses (for MessageField).
protobuf = "=3.7.2"
hex = "0.4"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
# Integration tests drive a live emulator; see tests/emulator.rs. ckb-node
# provides compute_signing_message for the sign-and-verify parity check.
ckb-node = { path = "../ckb-node" }
qpv2-core = { path = "../qpv2-core" }
ckb-types = "=1.0.1"
hex = "0.4"
env_logger = "0.11"
