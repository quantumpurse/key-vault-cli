[workspace]
members = [
	"crates/ckb-fips205-utils",
	"crates/keychain",
	"crates/qpv2-cli",
	"crates/qpv2-core",
	"crates/qpv2-gui",
	"crates/ckb-node",
	"crates/trezor-connect",
]
# Vendored path dependencies of trezor-connect; kept out of the workspace so our
# lint/build-all commands do not touch third-party code.
exclude = [
	"vendor/trezor-client",
	"vendor/trezor-thp",
]
resolver = "2"
